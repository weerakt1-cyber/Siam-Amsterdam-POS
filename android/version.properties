# Single source of truth for the Baze POS APK version.
# app/build.gradle reads these at build time (see versionCode/versionName there).
#
# Every sideloaded release: bump versionCode by 1 (Android installs an APK over
# an existing one ONLY when versionCode is higher), and set versionName to the
# human-facing label. This file IS tracked in git so version history is visible.
versionCode=2
versionName=1.1
